<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Saher Calculator</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:15px;
font-family:Arial,sans-serif;background:linear-gradient(135deg,#0f172a,#2563eb,#06b6d4)}
.calc{width:min(420px,100%);background:#111827;padding:20px;border-radius:28px;box-shadow:0 20px 60px #0008}
h1{color:white;text-align:center;margin:0 0 5px;font-size:25px}
.sub{color:#94a3b8;text-align:center;margin-bottom:15px}
#display{width:100%;height:90px;background:#020617;color:white;border:2px solid #334155;
border-radius:18px;padding:10px 15px;font-size:34px;text-align:right;direction:ltr;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
button{height:60px;border:0;border-radius:16px;font-size:21px;font-weight:bold;color:white;cursor:pointer}
button:active{transform:scale(.95)}
.num{background:#334155}.op{background:#f59e0b}.func{background:#64748b}.clear{background:#ef4444}.eq{background:#22c55e}
.zero{grid-column:span 2}
</style>
</head>
<body>
<div class="calc">
<h1>🧮 AI Saher</h1>
<div class="sub">العملية كاملة تظهر أمامك</div>
<input id="display" value="0" readonly>
<div class="grid">
<button class="clear" onclick="clearAll()">AC</button>
<button class="func" onclick="backspace()">⌫</button>
<button class="func" onclick="percent()">%</button>
<button class="op" onclick="operator('/')">÷</button>

<button class="num" onclick="number('7')">7</button>
<button class="num" onclick="number('8')">8</button>
<button class="num" onclick="number('9')">9</button>
<button class="op" onclick="operator('*')">×</button>

<button class="num" onclick="number('4')">4</button>
<button class="num" onclick="number('5')">5</button>
<button class="num" onclick="number('6')">6</button>
<button class="op" onclick="operator('-')">−</button>

<button class="num" onclick="number('1')">1</button>
<button class="num" onclick="number('2')">2</button>
<button class="num" onclick="number('3')">3</button>
<button class="op" onclick="operator('+')">+</button>

<button class="num zero" onclick="number('0')">0</button>
<button class="num" onclick="number('.')">.</button>
<button class="eq" onclick="equals()">=</button>
</div>
</div>

<script>
var expression = "";
var firstNumber = null;
var currentOperator = null;
var waitingForNumber = false;
var display = document.getElementById("display");

function show(){
  display.value = expression === "" ? "0" : expression;
}

function number(n){
  if(expression === "خطأ") clearAll();

  if(waitingForNumber){
    expression = "";
    waitingForNumber = false;
  }

  var parts = expression.split(/[+\-*/]/);
  var current = parts[parts.length - 1];

  if(n === "." && current.indexOf(".") !== -1) return;

  if(expression === "" || expression === "0"){
    expression = n === "." ? "0." : n;
  }else{
    expression += n;
  }
  show();
}

function operator(o){
  if(expression === "" || expression === "خطأ") return;

  if(currentOperator !== null && !waitingForNumber){
    equals();
  }

  firstNumber = Number(expression);
  currentOperator = o;

  var symbol = o === "+" ? " + " : o === "-" ? " − " : o === "*" ? " × " : " ÷ ";
  expression = String(firstNumber) + symbol;
  waitingForNumber = true;
  show();
}

function equals(){
  if(firstNumber === null || currentOperator === null) return;

  var match = expression.match(/[-+]?[0-9]*\.?[0-9]+$/);
  if(!match) return;

  var secondNumber = Number(match[0]);
  var result;

  if(currentOperator === "+") result = firstNumber + secondNumber;
  if(currentOperator === "-") result = firstNumber - secondNumber;
  if(currentOperator === "*") result = firstNumber * secondNumber;

  if(currentOperator === "/"){
    if(secondNumber === 0){
      expression = "خطأ";
      firstNumber = null;
      currentOperator = null;
      waitingForNumber = true;
      show();
      return;
    }
    result = firstNumber / secondNumber;
  }

  expression = String(Number(result.toFixed(10)));
  firstNumber = null;
  currentOperator = null;
  waitingForNumber = true;
  show();
}

function percent(){
  if(expression !== "" && firstNumber === null){
    expression = String(Number(expression) / 100);
    show();
  }
}

function backspace(){
  if(waitingForNumber || expression === "خطأ"){
    clearAll();
    return;
  }
  expression = expression.length > 1 ? expression.slice(0,-1) : "";
  show();
}

function clearAll(){
  expression = "";
  firstNumber = null;
  currentOperator = null;
  waitingForNumber = false;
  show();
}
</script>
</body>
</html>

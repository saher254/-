<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ضربات الجزاء</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&family=Changa:wght@800&display=swap" rel="stylesheet">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light dark;
  --bg: #eef2ec; --panel: #ffffff; --text: #12222e; --muted: #5b6b77; --line: #c9d3cc;
  --me: #0f9d94; --opp: #e8563a; --ok: #1f9d55; --bad: #d64545; --accent: #ffb703;
  --btn: #12222e; --btn-text: #ffffff;
  --display: "Changa", "Cairo", system-ui, sans-serif;
  --body: "Cairo", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1822; --panel: #15293a; --text: #e9f1f5; --muted: #93a8b6; --line: #2c4356;
    --btn: #ffb703; --btn-text: #1a1200;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1822; --panel: #15293a; --text: #e9f1f5; --muted: #93a8b6; --line: #2c4356;
  --btn: #ffb703; --btn-text: #1a1200;
}
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: var(--body); font-size: 16px; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
#app { max-width: 520px; margin: 0 auto; padding: 10px 12px 18px; }
.top { display: flex; align-items: center; justify-content: space-between; padding: 4px 2px 10px; }
h1 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 26px; }
.conn { font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.conn::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
.conn.on::before { background: var(--ok); }

.panel { background: var(--panel); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.panel label { font-weight: 700; font-size: 14px; color: var(--muted); }
input { font: inherit; font-size: 18px; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--bg); color: var(--text); width: 100%; box-sizing: border-box; }
.btn { font: inherit; font-weight: 900; font-size: 18px; border-radius: 14px; padding: 14px 18px; border: 2px solid var(--btn); cursor: pointer; }
.btn.primary { background: var(--btn); color: var(--btn-text); }
.btn.ghost { background: transparent; color: var(--text); border-color: var(--line); }
.btn.small { font-size: 15px; padding: 10px 16px; }
.btn:disabled { opacity: .45; cursor: default; }
.btn:focus-visible, input:focus-visible, .zone:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.note { margin: 2px 0 0; font-size: 13.5px; line-height: 1.7; color: var(--muted); }
.big { margin: 0; font-size: 20px; font-weight: 900; line-height: 1.6; }
.code-badge { font-family: var(--display); font-size: 34px; letter-spacing: 6px; text-align: center; padding: 6px 0; }

.board { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; margin-bottom: 10px; }
.side { background: var(--panel); border-radius: 14px; padding: 8px 10px 10px; border-top: 5px solid var(--c); text-align: center; min-width: 0; }
.side.me { --c: var(--me); }
.side.opp { --c: var(--opp); }
.nm { font-size: 13px; font-weight: 700; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sc { font-family: var(--display); font-weight: 800; font-size: 42px; line-height: 1.1; }
.dots { display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; min-height: 14px; }
.dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line); box-sizing: border-box; }
.dot.g { background: var(--ok); border-color: var(--ok); }
.dot.x { background: var(--bad); border-color: var(--bad); }
.mid { display: flex; align-items: center; justify-content: center; min-width: 62px; text-align: center; font-size: 13px; font-weight: 700; color: var(--muted); line-height: 1.5; }

.scene { position: relative; border-radius: 16px; overflow: hidden; background: #0c1f31; }
.scene svg { display: block; width: 100%; height: auto; }
.zones { position: absolute; left: 8.333%; top: 13.333%; width: 83.333%; height: 43.333%; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); direction: ltr; }
.zone { background: transparent; border: 1.5px dashed rgba(255,255,255,.4); border-radius: 6px; margin: 2px; padding: 0; cursor: pointer; }
.zone:hover:not(:disabled) { background: rgba(255,255,255,.14); }
.zone.sel { background: rgba(255,183,3,.38); border: 2.5px solid var(--accent); }
.zone:disabled { cursor: default; }
#ball, #keeper { transform-origin: 0 0; }
#ball { transform: translate(180px,254px) scale(1) rotate(0deg); transition: transform .55s cubic-bezier(.2,.65,.35,1); }
#keeper { transform: translate(180px,128px) rotate(0deg); transition: transform .4s cubic-bezier(.2,.8,.3,1); }
#netg.shake { animation: shake .45s ease-out; }
@keyframes shake { 0%{transform:translate(0,0)} 20%{transform:translate(-3px,2px)} 40%{transform:translate(3px,-2px)} 60%{transform:translate(-2px,1px)} 100%{transform:translate(0,0)} }
.banner { position: absolute; inset-inline: 0; top: 62%; margin: 0 auto; width: max-content; max-width: 92%; text-align: center; font-family: var(--display); font-weight: 800; font-size: clamp(24px, 8vw, 40px); color: #fff; padding: 4px 22px 8px; border-radius: 16px; opacity: 0; transform: scale(.85); pointer-events: none; }
.banner.show { opacity: 1; transform: scale(1); transition: transform .25s cubic-bezier(.3,1.4,.5,1), opacity .15s; }
.banner.pos { background: var(--ok); }
.banner.neg { background: var(--bad); }
.status { margin: 12px 4px 8px; min-height: 30px; text-align: center; font-size: 19px; font-weight: 900; line-height: 1.5; }
.actions { display: flex; gap: 10px; align-items: stretch; }
.actions .primary { flex: 1; }

.overlay { position: fixed; inset: 0; background: rgba(6,14,20,.72); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 10; }
.card { background: var(--panel); border-radius: 22px; padding: 24px 22px; width: min(360px, 100%); display: flex; flex-direction: column; gap: 10px; text-align: center; }
.card h2 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 34px; }
.card .score { margin: 0 0 6px; font-family: var(--display); font-weight: 800; font-size: 46px; letter-spacing: 3px; direction: ltr; }
@media (prefers-reduced-motion: reduce) {
  #ball, #keeper { transition-duration: .01ms !important; }
  #netg.shake { animation: none; }
  .banner.show { transition: none; }
}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <h1>ضربات الجزاء</h1>
    <span id="conn" class="conn" hidden></span>
  </header>

  <main>
    <section id="lobby" class="panel">
      <label for="name">اسمك</label>
      <input id="name" maxlength="14" autocomplete="off" placeholder="لاعب">
      <label for="code">كود الغرفة (اكتب نفس الكود على الجهازين)</label>
      <input id="code" inputmode="numeric" maxlength="4" autocomplete="off" value="1234">
      <button id="btnOnline" class="btn primary" disabled>بيتجهّز الأونلاين…</button>
      <button id="btnCpu" class="btn ghost">العب ضد الكمبيوتر</button>
      <p id="lobbyNote" class="note"></p>
    </section>

    <section id="waiting" class="panel" hidden>
      <p class="big">في انتظار اللاعب التاني…</p>
      <div id="waitCode" class="code-badge"></div>
      <p class="note">افتح نفس الرابط على الجهاز التاني، واكتب نفس الكود، واضغط «العب ضد جهاز تاني».</p>
      <button id="btnCancel" class="btn ghost">إلغاء</button>
    </section>

    <section id="game" hidden>
      <div class="board">
        <div class="side me">
          <div class="nm" id="nmMe"></div>
          <div class="sc" id="scMe">0</div>
          <div class="dots" id="dotsMe"></div>
        </div>
        <div class="mid" id="kickNo"></div>
        <div class="side opp">
          <div class="nm" id="nmOpp"></div>
          <div class="sc" id="scOpp">0</div>
          <div class="dots" id="dotsOpp"></div>
        </div>
      </div>

      <div class="scene">
        <svg id="scene" viewBox="0 0 360 300" role="img" aria-label="مرمى ضربة جزاء">
          <defs>
            <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a1b2b"/><stop offset="1" stop-color="#26566f"/></linearGradient>
            <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
            <pattern id="net" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M0 0L9 9M9 0L0 9" stroke="#fff" stroke-opacity=".3" stroke-width=".8"/></pattern>
            <pattern id="crowd" width="9" height="8" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="3" r="2" fill="#e8563a" fill-opacity=".55"/><circle cx="7" cy="5.5" r="2" fill="#ffb703" fill-opacity=".5"/></pattern>
          </defs>
          <rect width="360" height="170" fill="url(#sky)"/>
          <ellipse cx="34" cy="8" rx="80" ry="34" fill="url(#glow)"/>
          <ellipse cx="326" cy="8" rx="80" ry="34" fill="url(#glow)"/>
          <rect y="12" width="360" height="28" fill="#0a1826"/>
          <rect y="12" width="360" height="28" fill="url(#crowd)"/>
          <rect y="170" width="360" height="12" fill="#2b7d3f"/>
          <rect y="182" width="360" height="16" fill="#358a47"/>
          <rect y="198" width="360" height="22" fill="#2b7d3f"/>
          <rect y="220" width="360" height="28" fill="#358a47"/>
          <rect y="248" width="360" height="52" fill="#2b7d3f"/>
          <g fill="none" stroke="#f6f8f4" stroke-opacity=".7" stroke-width="2">
            <line x1="0" y1="170" x2="360" y2="170"/>
            <polyline points="78,170 60,206 300,206 282,170"/>
            <polyline points="0,170 -20,292 380,292 360,170"/>
          </g>
          <ellipse cx="180" cy="262" rx="5" ry="2.2" fill="#f6f8f4"/>

          <g id="netg">
            <rect x="30" y="40" width="300" height="130" fill="#0a1826" fill-opacity=".45"/>
            <rect x="30" y="40" width="300" height="130" fill="url(#net)"/>
          </g>

          <g id="keeper">
            <rect x="-9" y="14" width="7" height="27" rx="3" fill="#152433"/>
            <rect x="2" y="14" width="7" height="27" rx="3" fill="#152433"/>
            <rect x="-13" y="-18" width="26" height="34" rx="9" fill="#ff9f1c"/>
            <line x1="-11" y1="-12" x2="-29" y2="-25" stroke="#ff9f1c" stroke-width="7" stroke-linecap="round"/>
            <line x1="11" y1="-12" x2="29" y2="-25" stroke="#ff9f1c" stroke-width="7" stroke-linecap="round"/>
            <circle cx="-31" cy="-27" r="5.5" fill="#f6f8f4"/>
            <circle cx="31" cy="-27" r="5.5" fill="#f6f8f4"/>
            <circle cx="0" cy="-27" r="9" fill="#e9c39a"/>
            <path d="M-9 -29 a9 9 0 0 1 18 0 z" fill="#2a1b12"/>
          </g>

          <g fill="#f6f8f4">
            <rect x="26" y="36" width="6" height="134" rx="2"/>
            <rect x="328" y="36" width="6" height="134" rx="2"/>
            <rect x="26" y="36" width="308" height="6" rx="2"/>
          </g>

          <g id="ball">
            <circle r="13" fill="#f6f8f4" stroke="#1a1a1a" stroke-width=".8"/>
            <path d="M0 -6 L5.7 -1.9 L3.5 4.9 L-3.5 4.9 L-5.7 -1.9 Z" fill="#1a1a1a"/>
            <path d="M0 -6 L0 -12.5 M5.7 -1.9 L12 -4 M3.5 4.9 L7.5 10.5 M-3.5 4.9 L-7.5 10.5 M-5.7 -1.9 L-12 -4" stroke="#1a1a1a" stroke-width="1.2" fill="none"/>
          </g>
        </svg>
        <div class="zones" id="zones"></div>
        <div id="banner" class="banner" role="status" aria-live="polite"></div>
      </div>

      <p id="status" class="status" aria-live="polite"></p>
      <div class="actions">
        <button id="confirm" class="btn primary" disabled>اضرب!</button>
        <button id="btnLeave" class="btn ghost small">خروج</button>
      </div>
    </section>
  </main>

  <div id="end" class="overlay" hidden>
    <div class="card" role="dialog" aria-modal="true" aria-labelledby="endTitle">
      <h2 id="endTitle"></h2>
      <p class="score" id="endScore"></p>
      <button id="btnRematch" class="btn primary">العب تاني</button>
      <button id="btnExit" class="btn ghost">خروج</button>
    </div>
  </div>
</div>

<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const ZX = [80, 180, 280], ZY = [78, 138];
const ZN = ["أعلى الشمال", "أعلى النص", "أعلى اليمين", "أسفل الشمال", "أسفل النص", "أسفل اليمين"];

/* ---------- helpers ---------- */
function load(k, d) { try { return localStorage.getItem(k) || d; } catch (e) { return d; } }
function save(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
const cleanName = v => String(v || "").replace(/[\p{Cc}\p{Cf}\p{Co}]/gu, "").trim().slice(0, 14) || "لاعب";
const cleanCode = v => String(v || "").replace(/\D/g, "").slice(0, 4) || "1234";
const zc = z => ({ x: ZX[z % 3], y: ZY[Math.floor(z / 3)] });

/* ---------- pure game rules ---------- */
function resolve(s, g) {
  const sz = s[0], l = s[1], gz = g[0];
  if (l < 0.06) return "miss";
  if (sz === gz) return "save";
  if (sz % 3 === gz % 3 && l < 0.5) return "tip";
  return "goal";
}
function matchWinner(results) {
  let mk = 0, ok = 0, mg = 0, og = 0;
  for (const r of results) {
    if (r.shooter === "me") { mk++; if (r.out === "goal") mg++; }
    else { ok++; if (r.out === "goal") og++; }
  }
  const rem = n => Math.max(0, 5 - n);
  if (mk < 5 || ok < 5) {
    if (mg > og + rem(ok)) return "me";
    if (og > mg + rem(mk)) return "opp";
    return null;
  }
  if (mk === ok && mg !== og) return mg > og ? "me" : "opp";
  return null;
}

/* ---------- state ---------- */
const S = {
  mode: null,        // "online" | "cpu"
  view: "lobby",     // "lobby" | "waiting" | "game"
  name: "", code: "",
  g: 1, host: true,
  mine: [], cpu: [], results: [],
  cur: 0, sel: null,
  animating: false, over: false,
  token: 0, pair: null
};
let room = null, connected = false;

const later = (ms, fn) => { const t = S.token; setTimeout(() => { if (t === S.token) fn(); }, ms); };

/* ---------- room (online) ---------- */
async function initRoom() {
  try {
    if (!(window.claude && window.claude.use)) throw new Error("no runtime");
    const r = await window.claude.use("room");
    if (!r) throw new Error("no room");
    room = r;
    room.onConnection(c => { connected = c; renderConn(); });
    room.onPeers(() => onPeers());
  } catch (e) { room = null; }
  renderLobby();
  renderConn();
}
function pub() {
  if (!room || S.mode !== "online") return;
  try {
    const p = room.presence({ mode: "online", code: S.code, name: S.name, g: S.g, picks: S.mine.map(x => [x[0], x[1]]) });
    if (p && p.catch) p.catch(() => {});
  } catch (e) {}
}
function clearPresence() {
  if (!room) return;
  try {
    const p = room.presence({ mode: null, code: null, name: null, g: null, picks: null });
    if (p && p.catch) p.catch(() => {});
  } catch (e) {}
}
function computePair() {
  if (!room) return null;
  const all = room.peers().filter(p => p.kind === "viewer" && p.presence && p.presence.mode === "online" && String(p.presence.code) === S.code);
  all.sort((a, b) => (a.peer < b.peer ? -1 : 1));
  const i = all.findIndex(p => p.sameTab);
  if (i < 0) return null;
  const j = i ^ 1;
  if (j >= all.length) return null;
  return { opp: all[j], host: i % 2 === 0 };
}
function oppPicks() {
  if (S.mode === "cpu") return S.cpu;
  if (!S.pair) return [];
  const op = S.pair.opp.presence;
  if (op.g !== S.g || !Array.isArray(op.picks)) return [];
  const out = [];
  for (const p of op.picks) {
    if (!Array.isArray(p)) break;
    const z = p[0], l = p[1];
    if (!Number.isInteger(z) || z < 0 || z > 5 || typeof l !== "number" || !(l >= 0 && l <= 1)) break;
    out.push([z, l]);
    if (out.length >= 120) break;
  }
  return out;
}
function onPeers() {
  if (S.mode !== "online") return;
  const pr = computePair();
  S.pair = pr;
  if (!pr) { renderAll(); return; }
  if (S.view === "waiting") { S.host = pr.host; startGame(S.g); return; }
  const op = pr.opp.presence;
  if (typeof op.g === "number" && op.g > S.g) { S.host = pr.host; startGame(op.g); return; }
  if (op.g === S.g && oppPicks().length < S.cur) { S.host = pr.host; startGame(S.g + 1); return; }
  tick();
}

/* ---------- game flow ---------- */
const iShootFirst = () => (S.mode === "cpu" ? S.g % 2 === 1 : S.host === (S.g % 2 === 1));
const shooterIsMe = k => (k % 2 === 0) === iShootFirst();
const oppName = () => {
  if (S.mode === "cpu") return "الكمبيوتر";
  const n = S.pair && S.pair.opp.presence.name;
  return cleanName(n && typeof n === "string" ? n : "اللاعب التاني");
};

function startGame(g) {
  S.g = g; S.view = "game"; S.token++;
  S.mine = []; S.cpu = []; S.results = [];
  S.cur = 0; S.sel = null; S.animating = false; S.over = false;
  $("end").hidden = true;
  const b = $("banner"); b.className = "banner"; b.textContent = "";
  resetScene();
  pub();
  renderAll();
}
function confirmPick() {
  const k = S.cur;
  if (S.sel == null || S.mine.length > k || S.animating || S.over) return;
  S.mine.push([S.sel, Math.round(Math.random() * 1000) / 1000]);
  if (S.mode === "cpu") S.cpu.push([Math.floor(Math.random() * 6), Math.round(Math.random() * 1000) / 1000]);
  pub();
  tick();
}
function tick() {
  if (S.view !== "game" || S.animating || S.over) { renderAll(); return; }
  const k = S.cur, op = oppPicks();
  if (S.mine.length > k && op.length > k) { playKick(k, op); return; }
  renderAll();
}

/* ---------- scene ---------- */
const ball = $("ball"), keeper = $("keeper");
function resetScene() {
  ball.style.transition = "none";
  ball.style.transform = "translate(180px,254px) scale(1) rotate(0deg)";
  void ball.getBoundingClientRect();
  ball.style.transition = "";
  keeper.style.transform = "translate(180px,128px) rotate(0deg)";
}
function bannerFor(r) {
  const me = r.shooter === "me";
  switch (r.out) {
    case "goal": return me ? ["جوووول! ⚽", "pos"] : ["جول ضدك 😬", "neg"];
    case "save": return me ? ["الحارس تصدّى! 🧤", "neg"] : ["تصدّيت! 🧤", "pos"];
    case "tip": return me ? ["لمسها بأطراف أصابعه!", "neg"] : ["تصدّيت بأطراف الأصابع! 🧤", "pos"];
    default: return me ? ["برّه المرمى! 😬", "neg"] : ["الخصم ضيّعها! 🙌", "pos"];
  }
}
function playKick(k, op) {
  S.animating = true;
  const meShoots = shooterIsMe(k);
  const s = meShoots ? S.mine[k] : op[k];
  const g = meShoots ? op[k] : S.mine[k];
  const out = resolve(s, g);
  const sz = s[0], l = s[1], gz = g[0];
  const t = zc(sz), col = sz % 3;
  renderAll();

  // ball
  let tx = t.x, ty = t.y, sc = 0.56;
  if (out === "miss") { if (col === 1) ty = 6; else tx = col === 0 ? 6 : 354; sc = 0.5; }
  ball.style.transform = `translate(${tx}px,${ty}px) scale(${sc}) rotate(${col === 0 ? -540 : 540}deg)`;
  // keeper
  const kcol = gz % 3, krow = Math.floor(gz / 3), kx = ZX[kcol];
  const rot = kcol === 1 ? 0 : (kcol === 0 ? -1 : 1) * (krow === 0 ? 62 : 80);
  keeper.style.transform = `translate(${kx}px,${krow === 0 ? 96 : 134}px) rotate(${rot}deg)`;

  later(620, () => {
    const r = { shooter: meShoots ? "me" : "opp", out };
    S.results.push(r);
    const [txt, tone] = bannerFor(r);
    const b = $("banner"); b.textContent = txt; b.className = "banner show " + tone;
    if (out === "goal") {
      const n = $("netg"); n.classList.remove("shake"); void n.getBoundingClientRect(); n.classList.add("shake");
    }
    if (out === "save" || out === "tip") {
      const dir = Math.floor(l * 1000) % 2 ? 1 : -1;
      ball.style.transition = "transform .5s cubic-bezier(.3,.6,.4,1)";
      const dy = out === "tip" ? 22 : 178;
      ball.style.transform = `translate(${t.x + dir * (out === "tip" ? 26 : 46)}px,${dy}px) scale(${out === "tip" ? 0.5 : 0.8}) rotate(${dir * 900}deg)`;
    }
    try { if (navigator.vibrate) navigator.vibrate(out === "goal" ? [30, 40, 30] : 20); } catch (e) {}
    renderAll();
  });
  later(2500, () => {
    const b = $("banner"); b.className = "banner"; b.textContent = "";
    $("netg").classList.remove("shake");
    resetScene();
    S.cur = k + 1; S.sel = null; S.animating = false;
    const w = matchWinner(S.results);
    if (w) { S.over = true; showEnd(w); }
    renderAll();
    if (!w) tick();
  });
}
function showEnd(w) {
  let mg = 0, og = 0;
  for (const r of S.results) if (r.out === "goal") { if (r.shooter === "me") mg++; else og++; }
  $("endTitle").textContent = w === "me" ? "كسبت! 🏆" : "الخصم كسب المباراة";
  $("endScore").textContent = mg + " - " + og;
  $("end").hidden = false;
  $("btnRematch").focus();
}

/* ---------- rendering ---------- */
const zonesEl = $("zones");
for (let i = 0; i < 6; i++) {
  const b = document.createElement("button");
  b.className = "zone"; b.type = "button"; b.setAttribute("aria-label", ZN[i]);
  b.addEventListener("click", () => {
    if (S.animating || S.over || S.mine.length > S.cur) return;
    S.sel = i; renderGame();
  });
  zonesEl.appendChild(b);
}
function renderDots(el, list, label) {
  el.replaceChildren();
  const n = Math.max(5, list.length);
  let goals = 0;
  for (let i = 0; i < n; i++) {
    const d = document.createElement("span");
    d.className = "dot";
    if (list[i]) { if (list[i].out === "goal") { d.classList.add("g"); goals++; } else d.classList.add("x"); }
    el.appendChild(d);
  }
  el.setAttribute("role", "img");
  el.setAttribute("aria-label", label + ": " + goals + " من " + list.length);
}
function renderGame() {
  const mineRes = S.results.filter(r => r.shooter === "me");
  const oppRes = S.results.filter(r => r.shooter === "opp");
  $("nmMe").textContent = S.name;
  $("nmOpp").textContent = oppName();
  $("scMe").textContent = mineRes.filter(r => r.out === "goal").length;
  $("scOpp").textContent = oppRes.filter(r => r.out === "goal").length;
  renderDots($("dotsMe"), mineRes, "ضرباتك");
  renderDots($("dotsOpp"), oppRes, "ضربات الخصم");
  const k = S.cur;
  $("kickNo").textContent = k >= 10 ? "ضربات فاصلة" : "الضربة " + (Math.floor(k / 2) + 1) + " من 5";

  const shoots = shooterIsMe(k);
  const locked = S.mine.length > k;
  const busy = S.animating || S.over;
  [...zonesEl.children].forEach((b, i) => {
    b.classList.toggle("sel", S.sel === i || (locked && S.mine[k] && S.mine[k][0] === i));
    b.disabled = busy || locked;
  });
  const btn = $("confirm");
  btn.textContent = shoots ? "اضرب!" : "ارتمِ!";
  btn.disabled = busy || locked || S.sel == null;

  let msg = "";
  if (S.over) msg = "";
  else if (S.animating) msg = "";
  else if (locked) msg = S.mode === "online" && !S.pair ? "الخصم مش موجود دلوقتي… مستنيينه" : "في انتظار الخصم…";
  else if (S.mode === "online" && !S.pair) msg = "الخصم مش موجود دلوقتي… مستنيينه";
  else msg = shoots ? "دورك تضرب! اختار الزاوية 🎯" : "دورك تحرس المرمى! توقّع الزاوية 🧤";
  $("status").textContent = msg;
}
function renderConn() {
  const c = $("conn");
  if (!room) { c.hidden = true; return; }
  c.hidden = false;
  c.classList.toggle("on", connected);
  c.textContent = connected ? "متصل" : "بيتصل…";
}
function renderLobby() {
  const b = $("btnOnline");
  b.disabled = !room;
  b.textContent = room ? "العب ضد جهاز تاني" : "الأونلاين مش متاح هنا";
  $("lobbyNote").textContent = room
    ? "اللعب بين الأجهزة بيشتغل لأجهزة نفس حساب Claude. افتح الرابط على الجهازين واكتب نفس الكود."
    : "اللعب بين جهازين محتاج تفتح الصفحة من رابط الـ Artifact في Claude. تقدر تلعب ضد الكمبيوتر دلوقتي.";
}
function renderAll() {
  $("lobby").hidden = S.view !== "lobby";
  $("waiting").hidden = S.view !== "waiting";
  $("game").hidden = S.view !== "game";
  if (S.view === "waiting") $("waitCode").textContent = S.code;
  if (S.view === "game") renderGame();
}

/* ---------- actions ---------- */
function joinOnline() {
  if (!room) return;
  S.name = cleanName($("name").value); S.code = cleanCode($("code").value);
  save("pk_name", S.name); save("pk_code", S.code);
  $("name").value = S.name; $("code").value = S.code;
  S.mode = "online"; S.view = "waiting"; S.g = 1; S.mine = []; S.pair = null;
  pub(); renderAll(); onPeers();
}
function playCpu() {
  S.name = cleanName($("name").value); save("pk_name", S.name);
  S.mode = "cpu"; S.pair = null; S.host = true;
  startGame(1);
}
function leave() {
  if (S.mode === "online") clearPresence();
  S.mode = null; S.view = "lobby"; S.token++; S.pair = null;
  S.animating = false; S.over = false;
  $("end").hidden = true;
  renderAll();
}
function rematch() {
  if (S.mode === "cpu") { startGame(S.g + 1); return; }
  const og = S.pair && typeof S.pair.opp.presence.g === "number" ? S.pair.opp.presence.g : 0;
  startGame(Math.max(S.g, og) + 1);
}

$("btnOnline").addEventListener("click", joinOnline);
$("btnCpu").addEventListener("click", playCpu);
$("btnCancel").addEventListener("click", leave);
$("btnLeave").addEventListener("click", leave);
$("btnExit").addEventListener("click", leave);
$("btnRematch").addEventListener("click", rematch);
$("confirm").addEventListener("click", confirmPick);
$("name").value = load("pk_name", "");
$("code").value = load("pk_code", "1234");

renderLobby();
renderAll();
initRoom();
})();
</script>
</body>
</html>
